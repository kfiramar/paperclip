name: github-pr-sync-bundle

on:
  workflow_dispatch:
  push:
    branches:
      - feat/github-pr-sync-control-plane
    paths:
      - "patches/github-pr-sync/**"
      - ".github/workflows/github-pr-sync-bundle.yml"

jobs:
  verify-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve bundle base commit
        id: bundle-base
        run: |
          COMMIT=$(python3 - <<'PY'
import json
from pathlib import Path
m = json.loads(Path("patches/github-pr-sync/manifest.json").read_text())
print(m.get("baseCommit", "origin/master"))
PY
          )
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Create clean apply target from bundle base
        run: |
          git fetch origin master --tags
          git worktree add --detach "$RUNNER_TEMP/paperclip-apply-target" "${{ steps.bundle-base.outputs.commit }}"

      - name: Apply native JS bundle
        run: node patches/github-pr-sync/apply.mjs "$RUNNER_TEMP/paperclip-apply-target"

      - name: Verify native JS bundle
        run: node patches/github-pr-sync/verify.mjs "$RUNNER_TEMP/paperclip-apply-target"
